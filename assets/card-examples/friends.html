<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>先碰头，再慢慢玩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172e2b}
.sheet{width:1080px;height:1440px;position:relative;padding:66px 74px;color:#f8f6e9;background:#172e2b;font-family:"Microsoft YaHei",sans-serif;--card-background-wash:rgba(23,46,43,.68)}
.kicker{display:inline-block;font-size:25px;letter-spacing:5px;margin:0;padding:12px 25px;border:2px dashed #a5b39b;transform:rotate(-2deg)}
.arrow{position:absolute;width:62px;height:62px;right:74px;top:51px;transform:rotate(-12deg)}
h1{font-family:"KaiTi","STKaiti",serif;font-size:80px;letter-spacing:-3px;line-height:1.4;margin:49px 0 22px;font-weight:400}
.date{display:inline-block;font-size:28px;color:#172e2b;background:#d8ecad;padding:10px 20px;margin:0 0 58px;transform:rotate(1deg)}
.ticket{position:relative;background:#f7f2e4;color:#29443d;padding:36px 40px 43px;box-shadow:9px 12px 0 #0f2422;transform:rotate(-1deg);border-bottom:3px dashed #c1b8a1}
.ticket:before{content:"";position:absolute;top:-16px;left:320px;width:220px;height:35px;background:repeating-linear-gradient(70deg,#b3cba3c9 0 7px,#d6debdc9 7px 14px);transform:rotate(3deg)}
h2{font-family:"KaiTi","STKaiti",serif;font-size:34px;margin:0 0 27px;letter-spacing:4px;color:#4d6756;font-weight:400}
.meet{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:center;font-size:30px;line-height:1.8;margin:0 0 32px;font-weight:700;color:#3f6753}
.clock{font-size:122px;font-weight:800;letter-spacing:-9px;line-height:1.3;font-variant-numeric:tabular-nums}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.route{font-size:28px;line-height:1.9;margin:0;padding-top:23px;border-top:1px solid #a5b39b}
.bring{display:inline-block;position:relative;font-size:31px;line-height:1.8;margin:51px 0 0;padding:19px 28px;background:#e4d2a9;color:#172e2b;font-weight:700;transform:rotate(2deg);box-shadow:4px 6px 0 #0f2422}
.bring:before{content:"";position:absolute;top:-11px;right:32px;width:78px;height:24px;background:#a5b39bc9;transform:rotate(-10deg)}
.pending{font-family:"KaiTi","STKaiti",serif;font-size:30px;line-height:1.9;color:#e4e8d7;margin:31px 0 0}
.demo{position:absolute;left:74px;bottom:107px;color:#a6b7a9;font-size:18px}
footer{position:absolute;left:74px;right:74px;bottom:49px;padding-top:22px;border-top:1px solid #789079;color:#a6b7a9;font-size:17px;letter-spacing:1px}
</style>
</head>
<body>
<article class="sheet" id="page-1">
<p class="kicker">周末碰头计划</p>
<svg class="arrow" viewBox="0 0 172 172" aria-hidden="true"><circle cx="86" cy="86" r="85" fill="#dbf18a"/><path d="M48 122L120 50M47 50H120V123" fill="none" stroke="#172e2b" stroke-width="13"/></svg>
<h1>先碰头，再慢慢玩。</h1>
<p class="date">10 月 2 日 · 示例河湾城</p>
<section class="ticket">
<h2>我们说好的</h2>
<p class="meet"><span class="clock">09:10</span><span>在示例车站南广场见。</span></p>
<div class="routes">
<p class="route">上午沿河散步，<br>中午一起找吃的。</p>
<p class="route">下午去哪儿，<br>吃饭时再决定。</p>
</div>
</section>
<p class="bring">各自带好水和雨具。</p>
<p class="pending">车次还没确定，出发前再对一下。</p>
<p class="demo">示例 · 所有安排均为虚构</p>
<footer data-card-credit>由 travel-planner 生成 · @杰纶hhh</footer>
</article>
</body>
</html>
