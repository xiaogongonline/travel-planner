<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>先碰头，再慢慢玩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172e2b}
.sheet{width:1080px;height:1440px;position:relative;padding:66px 74px;color:#f8f6e9;background:#172e2b;font-family:"Microsoft YaHei",sans-serif}
.kicker{font-size:25px;letter-spacing:5px;margin:0;padding-bottom:28px;border-bottom:2px solid #789079}
.arrow{position:absolute;width:62px;height:62px;right:74px;top:51px;transform:rotate(-12deg)}
h1{font-size:76px;letter-spacing:-3px;line-height:1.4;margin:64px 0 22px;font-weight:900}
.date{font-size:28px;color:#d8ecad;margin:0 0 68px}
.ticket{position:relative;border-top:2px solid #789079;border-bottom:2px solid #789079;padding:32px 0 48px}
h2{font-size:23px;margin:0 0 40px;letter-spacing:4px;color:#b4c5b4;font-weight:400}
.meet{display:grid;grid-template-columns:390px 1fr;gap:44px;align-items:center;font-size:32px;line-height:1.8;margin:0 0 47px;font-weight:700;color:#dbf18a}
.clock{font-size:139px;font-weight:800;letter-spacing:-9px;line-height:1.3;font-variant-numeric:tabular-nums}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:45px}
.route{font-size:30px;line-height:1.9;margin:0;padding-top:25px;border-top:1px solid #789079}
.bring{font-size:31px;line-height:1.8;margin:50px 0 0;padding:22px 28px;background:#dbf18a;color:#172e2b;font-weight:700}
.pending{font-size:25px;line-height:1.9;color:#c2cfbf;margin:31px 0 0}
.demo{position:absolute;left:74px;bottom:107px;color:#a6b7a9;font-size:18px}
footer{position:absolute;left:74px;right:74px;bottom:49px;padding-top:22px;border-top:1px solid #789079;color:#a6b7a9;font-size:17px;letter-spacing:1px}
</style>
</head>
<body>
<article class="sheet" id="page-1">
<p class="kicker">周末碰头计划</p>
<svg class="arrow" viewBox="0 0 172 172" aria-hidden="true"><circle cx="86" cy="86" r="85" fill="#dbf18a"/><path d="M48 122L120 50M47 50H120V123" fill="none" stroke="#172e2b" stroke-width="13"/></svg>
<h1>先碰头，再慢慢玩。</h1>
<p class="date">10 月 2 日 · 示例河湾城</p>
<section class="ticket">
<h2>我们说好的</h2>
<p class="meet"><span class="clock">09:10</span><span>在示例车站南广场见。</span></p>
<div class="routes">
<p class="route">上午沿河散步，<br>中午一起找吃的。</p>
<p class="route">下午去哪儿，<br>吃饭时再决定。</p>
</div>
</section>
<p class="bring">各自带好水和雨具。</p>
<p class="pending">车次还没确定，出发前再对一下。</p>
<p class="demo">示例 · 所有安排均为虚构</p>
<footer data-card-credit>由 travel-planner 生成 · @杰纶hhh</footer>
</article>
</body>
</html>
